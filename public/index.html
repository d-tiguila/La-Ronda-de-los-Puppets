<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Marionetas MIDI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Coro colectivo</p>
          <h1>Marionetas MIDI</h1>
        </div>
        <div class="connection">
          <span id="socketDot" class="dot" aria-hidden="true"></span>
          <span id="socketLabel">Conectando</span>
        </div>
      </header>

      <section class="stage" aria-labelledby="chooseTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Test manual</p>
            <h2 id="chooseTitle">Elige tu marioneta</h2>
          </div>
          <p id="touchDesignerState" class="td-state">TouchDesigner sin conectar</p>
        </div>
        <div id="puppetGrid" class="puppet-grid" aria-live="polite"></div>
      </section>

      <section id="controller" class="controller" hidden>
        <div class="section-heading selected">
          <div>
            <p id="selectedRole" class="eyebrow">Marioneta</p>
            <h2 id="selectedTitle">Control</h2>
          </div>
          <button id="changePuppet" class="icon-button" type="button" title="Cambiar marioneta" aria-label="Cambiar marioneta">
            <span aria-hidden="true">&#8635;</span>
          </button>
        </div>

        <div class="control-layout">
          <section class="surface notes-surface" aria-labelledby="notesTitle">
            <h3 id="notesTitle">Acordes</h3>
            <div id="notePads" class="note-pads"></div>
            <button id="energyButton" class="energy-button" type="button">Energia del grupo</button>
          </section>
        </div>
      </section>

      <p id="notice" class="notice" role="status"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escenario Sonoro</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="stage-page">
    <main class="stage-shell">
      <section class="stage-toolbar" aria-label="Estado del escenario">
        <div>
          <p class="eyebrow">Jardin colectivo</p>
          <h1>Jardin Sonoro</h1>
        </div>
        <div class="stage-stats">
          <button id="pauseButton" class="stage-control" type="button" aria-pressed="false">Pausa</button>
          <span id="stageSocket">Conectando</span>
          <span id="userCount">0 flores</span>
          <span id="tdState">TouchDesigner sin conectar</span>
        </div>
      </section>

      <section id="stageWorld" class="stage-world" aria-label="Jardin sonoro colectivo">
        <div id="playhead" class="radial-wave" aria-hidden="true"></div>
        <div id="emptyState" class="empty-state">
          Abre la pagina en un celular, elige un instrumento y agita para sembrar una flor.
        </div>
      </section>
    </main>

    <script src="/vendor/matter.min.js"></script>
    <script src="/vendor/gsap.min.js"></script>
    <script type="module" src="/stage.js"></script>
  </body>
</html>
